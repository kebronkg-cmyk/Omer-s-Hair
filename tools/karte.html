<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Jost'; src: url('../assets/fonts/jost-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 300 700; }
html, body { margin: 0; background: #050507; }
.k { position: relative; width: 1200px; height: 1500px; overflow: hidden; font-family: 'Jost'; color: #fff;
  background:
    radial-gradient(70% 45% at 78% 22%, rgb(63 130 255 / .34), transparent 70%),
    radial-gradient(60% 40% at 10% 88%, rgb(23 71 201 / .30), transparent 70%),
    #050507; }
.k::before { content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 199px, rgb(255 255 255 / .06) 199px 200px); }
.logo { position: absolute; left: 90px; top: 92px; height: 120px; }
.nr { position: absolute; right: 90px; top: 110px; font-size: 30px; letter-spacing: .3em; color: rgb(255 255 255 / .6); }
.wort { position: absolute; left: 80px; right: 60px; bottom: 250px; font-size: 220px; line-height: .86; font-weight: 600; letter-spacing: -.035em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, #eef2fa 16%, #c5ccdc 33%, #f7f9fd 44%, #59627a 49.5%, #0d1018 52%, #222b42 57%, #5c7fc4 70%, #b9d0ff 84%, #f2f7ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgb(255 255 255 / .25)) drop-shadow(0 0 34px rgb(63 130 255 / .4)); }
.linie { position: absolute; left: 90px; right: 90px; bottom: 190px; height: 3px; border-radius: 3px;
  background: linear-gradient(90deg, #1747c9, #3f82ff 45%, #d9e7ff); box-shadow: 0 0 24px #3f82ff, 0 0 60px rgb(63 130 255 / .7); }
.unter { position: absolute; left: 90px; bottom: 100px; font-size: 34px; letter-spacing: .26em; text-transform: uppercase; color: rgb(255 255 255 / .75); }
</style></head><body>
<div class="k"><img class="logo" src="../assets/img/logo-hell.webp" alt=""><span class="nr" id="nr"></span>
<div class="wort" id="wort"></div><div class="linie"></div><div class="unter" id="unter"></div></div>
<script>
const p = new URLSearchParams(location.search);
document.getElementById('wort').innerHTML = p.get('wort'); if (p.get('gr')) document.getElementById('wort').style.fontSize = p.get('gr') + 'px';
document.getElementById('unter').textContent = p.get('unter');
document.getElementById('nr').textContent = p.get('nr');
</script></body></html>
